# This workflow builds the app on supported Node.js versions and runs tests where node:sqlite is available.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "local-project-upload" ]
  pull_request:
    branches: [ "local-project-upload" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # The API tests use node:sqlite, which is only available in Node.js 22.

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Run tests (Node.js 22 only; required node:sqlite module)
      if: matrix.node-version == '22.x'
      run: npm test
