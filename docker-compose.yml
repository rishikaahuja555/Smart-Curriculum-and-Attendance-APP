services:
  postgres:
    image: postgres:16-alpine
    container_name: airs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: airs
      POSTGRES_USER: airs
      POSTGRES_PASSWORD: airs_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airs -d airs"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
